const oddPositions=[0,2,1,0,1,2,0,2];
lessons.forEach((lesson,lessonIndex)=>{
  lesson.oddAnswers=[];
  lesson.odd=lesson.odd.map((row,i)=>{
    const correctWord=row[3];
    const position=oddPositions[(i+lessonIndex*2)%oddPositions.length];
    const others=row.slice(0,3);
    others.splice(position,0,correctWord);
    lesson.oddAnswers.push(position);

let active=Math.max(0,Math.min(2,(Number(new URLSearchParams(location.search).get('lekcja'))||1)-1));const selections={};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function svgScene(i){let motifs=['⚽','🎧','🎮','🌍'];return `<svg viewBox="0 0 480 220" role="img" aria-label="Ilustracja: uczniowie i hobby"><defs><linearGradient id="g${i}" x2="1" y2="1"><stop stop-color="${lessons[i].colors[0]}"/><stop offset="1" stop-color="${lessons[i].colors[1]}"/></linearGradient></defs><rect width="480" height="220" rx="24" fill="url(#g${i})"/><circle cx="110" cy="62" r="27" fill="#f5bb88"/><path d="M80 58q8-48 57-20l2 18q-25-17-59 2" fill="#2d375f"/><path d="M57 210q5-118 54-118t59 118" fill="#426ad5"/><circle cx="319" cy="70" r="27" fill="#e9a977"/><path d="M288 65q-1-50 58-24l-2 20q-24-16-56 4" fill="#402c3d"/><path d="M264 210q4-114 56-114t62 114" fill="#f18e55"/><rect x="185" y="25" width="78" height="59" rx="18" fill="white" opacity=".93"/><text x="224" y="64" text-anchor="middle" font-size="32">${motifs[i]}</text><circle cx="417" cy="50" r="25" fill="white" opacity=".8"/><text x="417" y="59" text-anchor="middle" font-size="27">⭐</text></svg>`}
let playbackId=0;
function germanVoices(){return speechSynthesis.getVoices().filter(v=>/^de(?:-|$)/i.test(v.lang))}
function pickVoices(){const v=germanVoices();const female=v.find(x=>/female|katja|hedda|helena|anna|petra|vicki|marlene|google deutsch/i.test(x.name))||v[0]||null;const male=v.find(x=>x!==female&&/male|conrad|markus|stefan|daniel|bernd|martin|hans|ralf/i.test(x.name))||v.find(x=>x!==female)||null;return [female,male]}
function speakerGender(name){return ['Mia','Lena','Sofia'].includes(name)?0:1}
function voiceNotice(){const v=pickVoices();const e=document.getElementById('voice-notice');if(e)e.textContent=v[0]&&v[1]?'✓ Wykryto dwa niemieckie głosy. Postacie żeńskie i męskie mają przypisane odpowiednie role głosowe (zależnie od dostępnych głosów systemowych).':v[0]?'ℹ Wykryto tylko jeden niemiecki głos. Role będą odróżniane tempem i wysokością głosu; aby uzyskać dwa prawdziwe głosy, zainstaluj drugi niemiecki głos systemowy.':'ℹ Brak wykrytego niemieckiego głosu. Przeglądarka spróbuje użyć głosu domyślnego. Dla poprawnej wymowy zainstaluj niemieckie głosy.'}
function stopAudio(){playbackId++;speechSynthesis.cancel();const btn=document.getElementById('play');if(btn){btn.disabled=false;btn.textContent='▶ Odtwórz cały dialog'}document.querySelectorAll('.line').forEach(e=>e.style.outline='none')}
function speakLine(text,rate=.86,speaker=0){return new Promise(resolve=>{if(!('speechSynthesis'in window)){alert('Ta przeglądarka nie obsługuje syntezy mowy.');resolve();return}const vs=pickVoices(),v=vs[speaker%2]||vs[0];const parts=(text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text]).map(t=>t.trim()).filter(Boolean);let idx=0;function next(){if(idx>=parts.length){resolve();return}let part=parts[idx++],question=part.endsWith('?');const u=new SpeechSynthesisUtterance(part);u.lang='de-DE';if(v)u.voice=v;u.rate=question?Math.max(.68,rate-.12):rate;u.pitch=(speaker%2===0?1.13:.88)+(question?.13:0);u.onend=next;u.onerror=next;speechSynthesis.speak(u)}next()})}
async function playDialog(){stopAudio();const run=playbackId,btn=document.getElementById('play');btn.disabled=true;btn.textContent='🔊 Odtwarzanie…';const dialog=lessons[active].dialog;for(let j=0;j<dialog.length;j++){if(run!==playbackId||!document.getElementById('play'))break;document.querySelectorAll('.line').forEach((e,k)=>e.style.outline=k===j?'3px solid #ffb637':'none');await speakLine(dialog[j][1],.84,speakerGender(dialog[j][0]));}if(run===playbackId)stopAudio()}
function playReading(){stopAudio();speakLine(lessons[active].reading,.84,0)}
function playSingleLine(j){stopAudio();const d=lessons[active].dialog;speakLine(d[j][1],.84,speakerGender(d[j][0]))}
function quiz(id,items){return items.map(([q,opts],n)=>`<div class="q" data-q="${id}-${n}"><b>${n+1}. ${esc(q)}</b><div class="choices">${opts.map((x,j)=>`<button type="button" onclick="pick(this,${j})">${esc(x)}</button>`).join('')}</div></div>`).join('')+`<button class="primary" onclick="checkQuiz('${id}')">✓ Sprawdź odpowiedzi</button><div class="status" id="s-${id}" aria-live="polite"></div>`}function pick(btn,j){let q=btn.closest('.q');q.dataset.choice=j;q.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateCheckButtons()}function checkQuiz(id){let answers=id==='audio'?lessons[active].audioQ:lessons[active].readQ;let n=0;answers.forEach((it,i)=>{let q=document.querySelector(`[data-q="${id}-${i}"]`);let v=Number(q.dataset.choice);let ok=q.dataset.choice!==undefined&&v===it[2];if(ok)n++;q.querySelectorAll('button').forEach((b,j)=>{b.classList.remove('correct','incorrect');if(j===it[2])b.classList.add('correct');else if(q.dataset.choice!==undefined&&j===v)b.classList.add('incorrect')})});let s=document.getElementById('s-'+id);s.textContent=`Wynik: ${n}/${answers.length}. ${n===answers.length?'Wunderbar!':'Spróbuj poprawić odpowiedzi.'}`;s.className='status '+(n===answers.length?'good':'bad')}
function checkFill(){let n=0;lessons[active].fill.forEach((x,i)=>{let input=document.getElementById('fill'+i),ok=input.value.trim().toLocaleLowerCase('de')===x[1].toLocaleLowerCase('de');input.style.borderColor=ok?'#137c63':'#c83e43';if(ok)n++});document.getElementById('s-fill').textContent=`${n}/${lessons[active].fill.length} poprawnych. ${n===lessons[active].fill.length?'Sehr gut!':'Sprawdź czerwone pola.'}`}
function choosePicture(card){card.classList.toggle('selected');if(active===0){const label=card.querySelector('.pic-label');label.textContent=card.classList.contains('selected')?card.dataset.label:'Kliknij, aby odkryć słowo';label.classList.toggle('unknown',!card.classList.contains('selected'));if(card.classList.contains('selected')){speechSynthesis.cancel();speakLine(card.dataset.label,.85)}}document.getElementById('s-pic').textContent='';document.getElementById('s-pic').className='status'}
function clearPictures(){document.querySelectorAll('.pic').forEach(card=>{card.classList.remove('selected','wrong');if(active===0){let label=card.querySelector('.pic-label');label.textContent='Kliknij, aby odkryć słowo';label.classList.add('unknown')}});document.getElementById('s-pic').textContent='';document.getElementById('s-pic').className='status'}
function checkPicture(){let cards=[...document.querySelectorAll('.pic')];let correct=cards.filter(c=>c.dataset.good==='1');let selected=cards.filter(c=>c.classList.contains('selected'));let wrong=selected.filter(c=>c.dataset.good!=='1');let missing=correct.filter(c=>!c.classList.contains('selected'));cards.forEach(c=>c.classList.toggle('wrong',wrong.includes(c)));let s=document.getElementById('s-pic');if(!wrong.length&&!missing.length){s.textContent=`Richtig! ✓ Zaznaczono wszystkie ${correct.length} poprawne obrazki.`;s.className='status good'}else{s.textContent=`Jeszcze nie! Poprawne wybory: ${selected.length-wrong.length}/${correct.length}. ${wrong.length?'Czerwone obrazki nie pasują. ':''}${missing.length?'Znajdź jeszcze brakujące dyscypliny sportowe lub odpowiednie ilustracje.':''}`;s.className='status bad'}}
let orderIdx=0,orderWords=[];function nextOrder(){orderIdx=(orderIdx+1)%lessons[active].order.length;renderOrder();voiceNotice()}function renderOrder(){orderWords=[];let words=lessons[active].order[orderIdx];document.getElementById('orderNumber').textContent=`Zdanie ${orderIdx+1}/${lessons[active].order.length}`;document.getElementById('wordbank').innerHTML=words.slice().reverse().map((w,i)=>`<button onclick="addWord(this)">${esc(w)}</button>`).join('');document.getElementById('answerbox').innerHTML='';document.getElementById('s-order').textContent='';updateCheckButtons()}function addWord(b){orderWords.push(b.textContent);document.getElementById('answerbox').appendChild(b);updateCheckButtons();b.onclick=()=>{b.remove();orderWords=orderWords.filter((_,i)=>i!==Array.from(document.getElementById('answerbox').children).indexOf(b));renderOrder();voiceNotice()}}function checkOrder(){let target=lessons[active].order[orderIdx].join(' ').replace(/ ([?.!])/g,'$1').toLowerCase();let got=orderWords.join(' ').replace(/ ([?.!])/g,'$1').toLowerCase();document.getElementById('s-order').textContent=target===got?'Richtig! ✓':'Jeszcze nie. Spróbuj ponownie.'}function checkOdd(){let n=0;lessons[active].odd.forEach((row,i)=>{let v=document.querySelector(`input[name="odd${i}"]:checked`);if(v&&Number(v.value)===lessons[active].oddAnswers[i])n++});document.getElementById('s-odd').textContent=`${n}/${lessons[active].odd.length} poprawnych odpowiedzi.`}
function render(){stopAudio();const L=lessons[active];document.getElementById('tabs').innerHTML=lessons.map((x,i)=>`<button class="${i===active?'active':''}" onclick="active=${i};render()">Lekcja ${i+1} · ${esc(x.title)}</button>`).join('');let targetPicture=active===0?['Fußball','Basketball','Tennis','Volleyball spielen']:active===1?['schwimmen','joggen']:['Deutsch','Englisch','Spanisch','Französisch','Polnisch'];document.getElementById('app').innerHTML=`<section class="hero"><div><span class="pill">LEKTION ${active+1} · 40 MINUT</span><h2>${esc(L.title)}</h2><p>${esc(L.subtitle)}</p><div class="timeline"><span>5' rozgrzewka</span><span>7' słuchanie</span><span>8' czytanie</span><span>12' ćwiczenia</span><span>8' utrwalenie</span></div></div>${svgScene(active)}</section>
<section class="activity"><h3>🖼️ 1. Bild-Warm-up – ${active===1?"Welchen Sport kannst du allein machen?":"Welche Sportarten siehst du?"}</h3><p class="sub">${active===0?'Przyjrzyj się 8 obrazkom. <b>Kliknij tylko obrazki przedstawiające dyscypliny sportowe (są 3).</b> Po kliknięciu odkryjesz niemieckie słowo i usłyszysz wymowę. Gdy wybierzesz wszystkie trzy, naciśnij „Sprawdź wybór”. Kliknij ponownie, aby odznaczyć.':active===1?'Przyjrzyj się ilustracjom. <b>Wybierz tylko te dyscypliny sportowe, które można uprawiać samodzielnie, bez drużyny ani partnera (2 poprawne odpowiedzi).</b> Nie zaznaczaj innych hobby, nawet jeśli można wykonywać je w pojedynkę. Następnie kliknij „Sprawdź wybór”.':'Obejrzyj ilustracje. Kliknij wszystkie nazwy języków.'}</p><div class="picgrid">${L.pictures.map(([emo,label])=>`<button type="button" class="pic" data-label="${esc(label)}" data-good="${targetPicture.includes(label)?1:0}" onclick="choosePicture(this)" aria-label="${active===0?'Odkryj obrazek':esc(label)}"><div class="art" role="img" aria-hidden="true">${emo}</div><span class="pic-label ${active===0?'unknown':''}">${active===0?'Kliknij, aby odkryć słowo':esc(label)}</span></button>`).join('')}</div><div class="controls"><button class="primary" onclick="checkPicture()">✓ Sprawdź wybór</button><button onclick="clearPictures()">↺ Zacznij od nowa</button></div><div class="status" id="s-pic" aria-live="polite"></div></section>
<section class="activity"><h3>🎧 2. Hördialog – posłuchaj rozmowy</h3><p class="sub">Najpierw ukryj tekst. Posłuchaj dwukrotnie i odpowiedz na pytania. Każdą wypowiedź można odsłuchać osobno.</p><div class="controls"><button class="primary" id="play" onclick="playDialog()">▶ Odtwórz cały dialog</button><button onclick="stopAudio()">■ Stop</button><button onclick="document.getElementById('dialog').classList.toggle('hide')">👁 Pokaż / ukryj dialog</button></div><p class="muted" id="voice-notice">Głosy są wybierane automatycznie na tym komputerze.</p><p class="muted">Pytania odczytywane są wolniej i z podwyższoną intonacją. Efekt zależy od głosu systemowego.</p><div class="dialog hide" id="dialog">${L.dialog.map(([name,line],j)=>`<div class="line"><div class="avatar">${speakerGender(name)===0?'👩':'🧑'}</div><div class="bubble"><b>${esc(name)}:</b> ${esc(line)} <button class="small" onclick="playSingleLine(${j})">🔊</button></div></div>`).join('')}</div><h4>Hörverstehen – zaznacz odpowiedź</h4>${quiz('audio',L.audioQ)}</section>
<section class="activity"><h3>📖 3. Lesestudio – przeczytaj i odkryj informacje</h3><div class="reading">${esc(L.reading)}</div><div class="controls"><button onclick="playReading()">🔊 Posłuchaj tekstu</button></div><h4>Leseverstehen</h4>${quiz('read',L.readQ)}</section>
<section class="activity"><h3>✍️ 4. Grammatik-Labor – uzupełnij zdania</h3><p class="sub">${active===0?"Uzupełnij zdania odpowiednimi formami czasowników <strong>mögen</strong> (lubić) i <strong>finden</strong> (uważać, sądzić). Zwróć uwagę na podmiot i odmianę czasownika.":active===1?"Wpisz odpowiednią formę czasownika. Zwróć uwagę na osobę. W zdaniach 3 i 4 skorzystaj z czasownika podanego w nawiasie.":"Uzupełnij każde zdanie odpowiednią formą czasownika podanego w nawiasie: <strong>sprechen</strong> lub <strong>sein</strong>. Zwróć uwagę na podmiot."}</p>${L.fill.map(([q,a],i)=>`<div class="inputrow"><span class="sentence"><span>${i+1}. ${esc(q.split('___')[0])}</span><input id="fill${i}" type="text" aria-label="Forma czasownika w zdaniu ${i+1}" placeholder="…"><span>${esc(q.split('___')[1]||'')}</span></span></div>`).join('')}<div class="controls"><button class="primary" onclick="checkFill()">Sprawdź gramatykę</button></div><div class="status" id="s-fill"></div></section>
<section class="activity"><h3>🧩 5. Satz-Puzzle – ułóż zdanie</h3><p class="sub">Klikaj wyrazy w poprawnej kolejności. Zwróć uwagę na szyk zdania.</p><b id="orderNumber"></b><div class="wordbank" id="wordbank"></div><div class="answerbox" id="answerbox"></div><div class="controls"><button class="primary" onclick="checkOrder()">Sprawdź zdanie</button><button onclick="renderOrder()">Od nowa</button><button onclick="nextOrder()">Następne zdanie →</button></div><div class="status" id="s-order"></div></section>
<section class="activity"><h3>🔎 6. Wortdetektiv – znajdź intruza</h3><p class="sub">W każdym rzędzie wybierz wyraz, który nie pasuje do pozostałych.</p>${L.odd.map((row,i)=>`<div class="q"><b>Zestaw ${i+1}</b><div class="choices">${row.map((w,j)=>`<label><input type="radio" name="odd${i}" value="${j}"> ${esc(w)}</label>`).join('')}</div></div>`).join('')}<div class="controls"><button class="primary" onclick="checkOdd()">Sprawdź</button></div><div class="status" id="s-odd"></div></section>
<section class="activity"><h3>🗣️ 7. Dein Mini-Dialog – mów i pisz</h3><p class="sub">W parach ułóżcie trzy pytania i trzy odpowiedzi. Korzystajcie z banku słów i gotowych zwrotów poniżej, a następnie zapiszcie rozmowę.</p><div class="cards"><div class="mini"><b>Person A</b><p>${active===0?'Magst du …? / Wie findest du …?':active===1?'Was machst du gern? / Schwimmst du gern?':'Welche Sprachen sprichst du? / Lernst du gern Deutsch?'}</p></div><div class="mini"><b>Person B</b><p>${active===0?'Ja, ich mag … / Ich finde … toll.':active===1?'Ich … gern. / Nein, ich … nicht gern.':'Ich spreche … / Ich lerne gern …'}</p></div></div><div class="mini" style="margin-top:14px"><b>📚 Wortschatz und Redemittel – bank słów i zwrotów</b><div class="cards" style="margin-top:10px">${(active===0?[['Hobby i zainteresowania','Fußball · Basketball · Volleyball · Tennis · Karate · Hip-Hop · Karaoke · Filme · Konzerte · Videospiele'],['Pytania','Magst du …? · Was magst du? · Wie findest du …? · Magst du auch …?'],['Odpowiedzi','Ja, ich mag … · Nein, ich mag … nicht. · Ich finde … toll / super / cool / interessant / langweilig / blöd / schrecklich.'],['Łączenie wypowiedzi','Und du? · Und wie findest du …? · Ich auch! · Ich nicht. · Aber ich mag …']]:active===1?[['Czynności','Fußball spielen · Volleyball spielen · Tennis spielen · joggen · schwimmen · singen · fotografieren · Musik hören · Karate machen · Computer spielen'],['Pytania','Was machst du gern? · Spielst du gern …? · Schwimmst du gern? · Was machst du am Wochenende?'],['Odpowiedzi','Ich spiele gern … · Ich höre gern Musik. · Ich jogge gern. · Ich schwimme nicht gern. · Ja, sehr gern! · Nein, nicht gern.'],['Łączenie wypowiedzi','Und du? · Ich auch! · Ich nicht. · Am Wochenende … · Nach der Schule …']]:[['Języki','Deutsch · Englisch · Spanisch · Französisch · Polnisch'],['Czasowniki i hobby','sprechen · lernen · sein · Basketball spielen · Musik hören · fotografieren · schwimmen'],['Pytania','Welche Sprachen sprichst du? · Sprichst du Deutsch? · Lernst du Englisch? · Lernst du gern Sprachen? · Was machst du gern?'],['Odpowiedzi','Ich spreche Polnisch und Deutsch. · Ich lerne Englisch. · Ich spreche ein bisschen Spanisch. · Ja, sehr gern. · Nein, nicht gern.'],['Łączenie wypowiedzi','Und du? · Ich auch! · Das ist toll! · Nach der Schule … · Wir lernen zusammen.']]).map(([head,words])=>`<div class="mini" style="background:white"><b>${head}</b><p style="margin:6px 0 0">${words}</p></div>`).join('')}</div></div><textarea id="mydialog" style="width:100%;min-height:110px;border:2px solid #dce3f5;border-radius:12px;padding:12px;font:inherit;margin-top:12px" placeholder="A: …&#10;B: …"></textarea><div class="controls"><button onclick="navigator.clipboard?.writeText(document.getElementById('mydialog').value).then(()=>document.getElementById('s-write').textContent='Skopiowano tekst.')">📋 Kopiuj dialog</button><button onclick="window.print()">🖨 Drukuj stronę</button></div><div class="status" id="s-write"></div></section>`;renderOrder();voiceNotice();updateCheckButtons()}
render();if("speechSynthesis" in window)speechSynthesis.addEventListener?.("voiceschanged",voiceNotice);</script><script>
// Przyciski sprawdzania pojawiają się dopiero po ukończeniu danego zadania.
function updateCheckButtons(){
 const show=(selector,ready)=>{const b=document.querySelector(selector);if(b){b.hidden=!ready;b.style.display=ready?'':'none';}};
 show('button[onclick="checkPicture()"]',document.querySelectorAll('.pic.selected').length >= (active===0?3:active===1?4:5));
 for(const id of ['audio','read']){const qs=[...document.querySelectorAll(`.q[data-q^="${id}-"]`)];show(`button[onclick="checkQuiz('${id}')"]`,qs.length>0&&qs.every(q=>q.dataset.choice!==undefined));}
 const inputs=[...document.querySelectorAll('input[id^="fill"]')];show('button[onclick="checkFill()"]',inputs.length>0&&inputs.every(x=>x.value.trim().length>0));
 const wordCount=lessons[active].order[orderIdx].length;show('button[onclick="checkOrder()"]',orderWords.length===wordCount);
 const odd=lessons[active].odd;show('button[onclick="checkOdd()"]',odd.every((_,i)=>document.querySelector(`input[name="odd${i}"]:checked`)));
}
document.addEventListener('input',updateCheckButtons);
document.addEventListener('change',updateCheckButtons);
document.addEventListener('click',e=>{if(e.target.closest('.pic,.q button,.wordbank button,.answerbox button'))queueMicrotask(updateCheckButtons)});
// Funkcje renderujące zostały zdefiniowane wcześniej.
updateCheckButtons();
</script>
</body></html>
